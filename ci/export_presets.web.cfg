; CI 専用の Web 書き出し設定。秘密情報は含まない。
; ルートの export_presets.cfg は署名情報が入りうるので .gitignore で除外しており、
; CI がこのファイルを export_presets.cfg としてコピーして使う。
[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*"
export_path="build/web/index.html"

[preset.0.options]

; GitHub Pages では COOP/COEP ヘッダーを設定できないため、まずスレッドなしを試す。
; このオプションが 4.7 で有効か、スレッドなしで動くかは CI とブラウザで要確認。
variant/thread_support=false

; URL に ?debug を付けると、ブラウザのログ（エラー含む）と WebGL 情報を画面下に表示する。
; iPhone など、コンソールを開けない端末で原因を調べるための診断用。通常の表示には影響しない。
html/head_include="<script>(function(){if(!/[?&]debug/.test(location.search))return;var box=document.createElement('pre');box.style.cssText='position:fixed;left:0;right:0;bottom:0;max-height:50%;overflow:auto;margin:0;padding:6px;background:rgba(0,0,0,.85);color:#9f9;font:10px/1.25 monospace;z-index:99999;white-space:pre-wrap';var nl=String.fromCharCode(10);function add(t){if(!box.parentNode)document.documentElement.appendChild(box);box.textContent+=t+nl;box.scrollTop=box.scrollHeight;}['log','warn','error'].forEach(function(k){var o=console[k];console[k]=function(){try{add('['+k+'] '+Array.prototype.slice.call(arguments).join(' '));}catch(e){}o.apply(console,arguments);};});window.addEventListener('error',function(e){add('[onerror] '+e.message);});window.addEventListener('unhandledrejection',function(e){add('[reject] '+e.reason);});try{var c=document.createElement('canvas');var gl=c.getContext('webgl2');add('webgl2: '+(gl?gl.getParameter(gl.VERSION)+' | '+gl.getParameter(gl.RENDERER)+' | maxTex='+gl.getParameter(gl.MAX_TEXTURE_SIZE):'NOT AVAILABLE'));}catch(e){add('webgl2 check failed: '+e);}add('ua: '+navigator.userAgent+' dpr='+devicePixelRatio+' screen='+screen.width+'x'+screen.height);})();</script>"
