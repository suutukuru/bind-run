; CI 専用の Web 書き出し設定。秘密情報は含まない。
; ルートの export_presets.cfg は署名情報が入りうるので .gitignore で除外しており、
; CI がこのファイルを export_presets.cfg としてコピーして使う。
[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*"
export_path="build/web/index.html"

[preset.0.options]

; GitHub Pages では COOP/COEP ヘッダーを設定できないため、まずスレッドなしを試す。
; このオプションが 4.7 で有効か、スレッドなしで動くかは CI とブラウザで要確認。
variant/thread_support=false
