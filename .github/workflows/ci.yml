name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE_URL: https://github.com/godotengine/godot/releases/download/4.7.2-stable

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot and export templates (checksum verified)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" && cd "$RUNNER_TEMP/godot"
          BIN="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          TPL="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          curl -fsSLO "$GODOT_RELEASE_URL/$BIN"
          curl -fsSLO "$GODOT_RELEASE_URL/$TPL"
          curl -fsSLO "$GODOT_RELEASE_URL/SHA512-SUMS.txt"
          grep -E " (\*)?($BIN|$TPL)\$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "$BIN"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q "$TPL" -d tpl
          mv tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          ln -s "$PWD/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Import project
        run: godot --headless --path . --import

      - name: Run unit tests
        if: ${{ hashFiles('tests/run_tests.gd') != '' }}
        run: godot --headless --path . --script res://tests/run_tests.gd

      - name: Test runner self-check (a failing test must give exit code 1)
        if: ${{ hashFiles('tests/run_tests.gd') != '' }}
        run: |
          set +e
          out=$(godot --headless --path . --script res://tests/run_tests.gd -- --dir=res://tests/fixtures/failing 2>&1)
          rc=$?
          set -e
          echo "$out"
          [ "$rc" -eq 1 ] && echo "$out" | grep -q "FAIL .*test_always_fails"

      - name: Smoke run (the game scene must run 300 frames without script errors)
        run: |
          set +e
          out=$(godot --headless --path . res://scenes/main/main.tscn --quit-after 300 2>&1)
          rc=$?
          set -e
          echo "$out" | tail -30
          [ "$rc" -eq 0 ]
          if echo "$out" | grep -E "SCRIPT ERROR|^ERROR:|Parse Error"; then exit 1; fi

      - name: Export Web build
        run: |
          cp ci/export_presets.web.cfg export_presets.cfg
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          ls -la build/web

      - name: Check the build is single-threaded (no SharedArrayBuffer headers needed)
        run: |
          grep -n 'GODOT_THREADS_ENABLED' build/web/index.html
          if ! grep -q 'GODOT_THREADS_ENABLED = false' build/web/index.html; then
            echo "::error::Web build has threads enabled (or the flag was not found)"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web

  deploy-pages:
    # 既定ブランチへの push のときだけ公開する（他のブランチでは build-web の確認のみ）
    needs: build-web
    if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
